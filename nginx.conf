# 图片水印工具 —— nginx 站点配置
#
# 说明：安全响应头只在 server 级别声明一次，location 里使用 expires 控制缓存，
# 避免 add_header 在 location 内覆盖继承导致安全头丢失。

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    server_tokens off;

    # 严格 CSP：不允许任何网络请求，图片只来自本域 / blob / data
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; font-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # HTML 不缓存，保证发布后立刻生效
    expires -1;

    location = /index.html {
        expires -1;
    }

    location ~* \.(?:css|js|mjs|svg|png|jpe?g|webp|ico|woff2)$ {
        # 文件名未做内容哈希，缓存时间不宜过长，避免发布后拿到旧资源
        expires 1h;
        access_log off;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # 目录不列内容
    autoindex off;
}
